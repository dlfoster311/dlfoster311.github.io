version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Frigate NVR stack
#
#  Services:
#    frigate    — NVR + AI object detection
#    mosquitto  — MQTT broker (Frigate publishes events here)
#    notifier   — reads MQTT events, sends push notifications via ntfy
#
#  Prerequisites:
#    - Docker + Docker Compose on your machine
#    - Wyze RTSP enabled (Wyze app → Camera → Settings → Advanced → RTSP)
#
#  Quick start:
#    1. Edit the environment variables below (camera IPs, ntfy topic)
#    2. docker compose up -d
#    3. Open http://localhost:5000 for the Frigate web UI
#
#  Logs:
#    docker compose logs -f frigate
#    docker compose logs -f notifier
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Frigate NVR ─────────────────────────────────────────────────────────────
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    privileged: true       # needed for hardware decoder access
    shm_size: "256mb"      # frame buffer RAM — raise to 512mb for 4+ cameras
    depends_on:
      - mosquitto

    devices:
      # ── Uncomment what you have ───────────────────────────────────────────
      # Google Coral USB (~$60, makes AI ~10x faster — highly recommended)
      # - /dev/bus/usb:/dev/bus/usb

      # Intel integrated GPU (QuickSync hardware decode)
      # - /dev/dri/renderD128:/dev/dri/renderD128

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./storage:/media/frigate       # ⚠️ change left side to a large disk path
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000             # 1 GB HLS cache

    ports:
      - "5000:5000"        # Web UI
      - "8554:8554"        # RTSP re-stream (VLC, other apps)
      - "8555:8555/tcp"    # WebRTC TCP
      - "8555:8555/udp"    # WebRTC UDP

    environment:
      # ⚠️  Set these to your Wyze RTSP credentials
      FRIGATE_RTSP_USER:     "wyze"
      FRIGATE_RTSP_PASSWORD: "changeme"

    # Uncomment for NVIDIA GPU:
    # runtime: nvidia

  # ── Mosquitto MQTT broker ────────────────────────────────────────────────────
  # Frigate publishes detection events to MQTT. The notifier reads from here.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ── Push notification bridge ─────────────────────────────────────────────────
  # Listens to Frigate MQTT events and sends push notifications via ntfy.
  notifier:
    build: ./notifier
    container_name: frigate-notifier
    restart: unless-stopped
    depends_on:
      - mosquitto
      - frigate

    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"

      # ── ntfy settings ──────────────────────────────────────────────────────
      # 1. Install the ntfy app on your phone (iOS or Android — it's free)
      # 2. Pick a unique topic name — anyone who knows it can subscribe, so
      #    make it hard to guess (treat it like a password)
      # 3. Open the ntfy app → + → enter your topic name → Subscribe
      NTFY_URL:   "https://ntfy.sh"      # or your self-hosted ntfy address
      NTFY_TOPIC: "change-this-to-something-unique-abc123"  # ⚠️ change this!

      # Frigate's base URL — used to build links in notifications
      FRIGATE_URL: "http://frigate:5000"

      # ── What triggers an alert ─────────────────────────────────────────────
      # Comma-separated list of objects that will send a notification.
      # Remove "cat" and "dog" if you have pets and don't want alerts for them.
      ALERT_OBJECTS: "person,car"

      # Minimum AI confidence to alert (0.0–1.0). 0.75 = 75% sure.
      # Raise this if you're getting false positives.
      MIN_SCORE: "0.75"

      # Only alert when the object is inside a defined zone.
      # "true" = ignore objects wandering on the street outside your zones.
      # "false" = alert anywhere in the frame.
      REQUIRE_ZONE: "true"

      # Seconds before the same camera+object can alert again.
      # Prevents a person standing at your door from sending 50 notifications.
      ALERT_COOLDOWN: "120"

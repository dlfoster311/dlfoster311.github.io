version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
#  Frigate NVR — full feature stack
#
#  DO NOT edit this file manually.
#  Run ./setup.sh — it asks you questions and configures everything.
#
#  Services:  frigate · mosquitto · deepstack · double-take · ntfy · notifier · scrypted
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Frigate NVR ─────────────────────────────────────────────────────────────
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    privileged: true
    shm_size: "512mb"          # 512mb for 4 cameras
    depends_on:
      - mosquitto

    devices:
      # Uncomment after running setup.sh if you have an Intel GPU:
      # - /dev/dri/renderD128:/dev/dri/renderD128
      # Uncomment for Google Coral USB:
      # - /dev/bus/usb:/dev/bus/usb

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ${STORAGE_PATH:-./storage}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000

    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"

    environment:
      # Set by setup.sh → .env
      FRIGATE_RTSP_USER:     "${RTSP_USER:-wyze}"
      FRIGATE_RTSP_PASSWORD: "${RTSP_PASSWORD:-changeme}"
      FRIGATE_RTSP_PATH:     "${RTSP_PATH:-/live}"
      FRIGATE_CAM1_IP:       "${CAM1_IP:-YOUR_CAMERA_IP_1}"
      FRIGATE_CAM2_IP:       "${CAM2_IP:-YOUR_CAMERA_IP_2}"
      FRIGATE_CAM3_IP:       "${CAM3_IP:-}"
      FRIGATE_CAM4_IP:       "${CAM4_IP:-}"

  # ── Mosquitto MQTT broker ────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # ── DeepStack — face recognition AI ─────────────────────────────────────────
  deepstack:
    image: deepquestai/deepstack:latest
    container_name: deepstack
    restart: unless-stopped
    volumes:
      - ./deepstack:/datastore
    environment:
      VISION-FACE: "True"

  # ── Double-Take — face recognition orchestrator ───────────────────────────────
  # Train faces at http://localhost:3000
  double-take:
    image: jakowenko/double-take:latest
    container_name: double-take
    restart: unless-stopped
    depends_on:
      - mosquitto
      - deepstack
      - frigate
    volumes:
      - ./double-take:/double-take/.storage
    ports:
      - "3000:3000"

  # ── ntfy — self-hosted push notifications ────────────────────────────────────
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    volumes:
      - ./ntfy/cache:/var/cache/ntfy
    ports:
      - "8080:80"
    environment:
      NTFY_CACHE_FILE:                /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR:      /var/cache/ntfy/attachments
      NTFY_CACHE_DURATION:            "168h"   # 7 days of notification history
      NTFY_ATTACHMENT_EXPIRY_DURATION: "72h"   # keep digest images for 3 days
      NTFY_BASE_URL:                  "${NTFY_BASE_URL:-http://localhost:8080}"

  # ── Notification bridge ──────────────────────────────────────────────────────
  notifier:
    build: ./notifier
    container_name: frigate-notifier
    restart: unless-stopped
    depends_on:
      - mosquitto
      - ntfy

    environment:
      MQTT_HOST:   mosquitto
      MQTT_PORT:   "1883"
      NTFY_URL:    "http://ntfy:80"
      NTFY_TOPIC:  "${NTFY_TOPIC:-frigate-alerts}"
      FRIGATE_URL: "${FRIGATE_URL:-http://frigate:5000}"

      ALERT_OBJECTS:        "car,package"
      MIN_SCORE:            "0.75"
      REQUIRE_ZONE:         "true"
      ALERT_COOLDOWN:       "120"

      USE_FACE_RECOGNITION: "true"
      MIN_FACE_SCORE:       "0.80"
      KNOWN_PEOPLE:         "${KNOWN_PEOPLE:-}"
      FAMILY_ARRIVAL_ALERTS: "true"

      # Suppress non-urgent alerts at night (strangers + alarms always fire)
      QUIET_HOURS_START: "${QUIET_HOURS_START:-22}"   # 10pm
      QUIET_HOURS_END:   "${QUIET_HOURS_END:-7}"      # 7am

      # Spatial awareness — proximity thresholds (fraction of frame height)
      # close > 55% = right at camera, mid = 25–55%, far < 25% = street/edge
      PROXIMITY_CLOSE: "${PROXIMITY_CLOSE:-0.55}"
      PROXIMITY_MID:   "${PROXIMITY_MID:-0.25}"

  # ── Daily digest — morning summary + ghost composite image ───────────────────
  # Sends an 8am notification with yesterday's event counts and a ghost
  # composite: all person detections from the day overlaid into one image.
  # Edit DIGEST_HOUR in .env to change the time.
  digest:
    build: ./digest
    container_name: frigate-digest
    restart: unless-stopped
    depends_on:
      - frigate
      - ntfy
    environment:
      FRIGATE_URL:   "${FRIGATE_URL:-http://frigate:5000}"
      NTFY_URL:      "http://ntfy:80"
      NTFY_TOPIC:    "${NTFY_TOPIC:-frigate-alerts}"
      DIGEST_HOUR:   "${DIGEST_HOUR:-8}"
      MAX_SNAPSHOTS: "20"
      # Only use static cameras for the twin composite — exclude PTZ/pan cameras.
      # Set to comma-separated camera names, e.g.: TWIN_CAMERAS=front_door,backyard
      TWIN_CAMERAS:  "${TWIN_CAMERAS:-}"

  # ── License plate recognition ─────────────────────────────────────────────────
  # Reads plates from car events and sends an ntfy alert with the plate number.
  # Free tier (2,500 reads/month): https://platerecognizer.com/sign-up/
  # Set PLATE_RECOGNIZER_TOKEN in .env — leave empty to disable LPR.
  lpr:
    build: ./lpr
    container_name: frigate-lpr
    restart: unless-stopped
    depends_on:
      - mosquitto
      - ntfy
      - frigate
    volumes:
      - lpr-data:/data          # persists the plates.log between restarts
    environment:
      PLATE_RECOGNIZER_TOKEN: "${PLATE_RECOGNIZER_TOKEN:-}"
      MQTT_HOST:   mosquitto
      MQTT_PORT:   "1883"
      NTFY_URL:    "http://ntfy:80"
      NTFY_TOPIC:  "${NTFY_TOPIC:-frigate-alerts}"
      FRIGATE_URL: "${FRIGATE_URL:-http://frigate:5000}"
      LPR_OBJECTS: "car"
      MIN_PLATE_CONFIDENCE: "0.80"
      PLATE_COOLDOWN: "3600"          # 1 hour before re-alerting same plate
      LPR_REGION: "${LPR_REGION:-}"   # optional region hint, e.g. us-ca, ca-on

  # ── Scrypted — Apple HomeKit + Google Home ────────────────────────────────────
  # Setup at https://localhost:10443 → install Frigate NVR + HomeKit plugins
  scrypted:
    image: ghcr.io/koush/scrypted:latest
    container_name: scrypted
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./scrypted:/server/volume

volumes:
  lpr-data:
